{% extends "base.html" %}

{% block content %}
<div class="row">
    <div class="col-12">
        <h1 class="mb-4">АГХК проверка РД (2025.03.07)</h1>
        
        <!-- 01. Проверка PDF -->
        <div class="card mb-4">
            <div class="card-header bg-light">
                <h5 class="mb-0">Проверить PDF</h5>
            </div>
            <div class="card-body">
                <form id="pdfForm" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label class="form-label">Выберите PDF файлы:</label>
                        <input type="file" class="form-control" name="pdf_folder" multiple accept=".pdf">
                    </div>
                    <button type="submit" class="btn btn-primary">Запустить проверку</button>
                </form>
            </div>
        </div>

        <!-- 02. Проверка EXCEL MTO -->
        <div class="card mb-4">
            <div class="card-header bg-light">
                <h5 class="mb-0">Проверить EXCEL MTO</h5>
            </div>
            <div class="card-body">
                <div class="row mb-3">
                    <div class="col-md-6">
                        <form id="mtoDirForm" enctype="multipart/form-data">
                            <input type="hidden" name="att_type" value="{{ GuiConst.MTO_DIR }}">
                            <div class="mb-3">
                                <label class="form-label">Выберите папку с MTO:</label>
                                <input type="file" class="form-control" name="gs_files" multiple webkitdirectory>
                            </div>
                            <button type="submit" class="btn btn-primary">Проверить папку</button>
                        </form>
                    </div>
                    <div class="col-md-6">
                        <form id="mtoFileForm" enctype="multipart/form-data">
                            <input type="hidden" name="att_type" value="{{ GuiConst.MTO_FILE }}">
                            <div class="mb-3">
                                <label class="form-label">Выберите файл MTO:</label>
                                <input type="file" class="form-control" name="gs_files" accept=".xlsx,.xls">
                            </div>
                            <button type="submit" class="btn btn-primary">Проверить файл</button>
                        </form>
                    </div>
                </div>
                <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" id="googleSyncToggle">
                    <label class="form-check-label" for="googleSyncToggle">Синхронизировать базу с ГуглТаблицей?</label>
                </div>
            </div>
        </div>

        <!-- 03. Проверка NanoCAD и RFQ -->
        <div class="card mb-4">
            <div class="card-header bg-light">
                <h5 class="mb-0">Проверить вывод NanoCAD (СО) и RFQ</h5>
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-6">
                        <form id="nanocadForm" enctype="multipart/form-data">
                            <div class="mb-3">
                                <label class="form-label">Файл NanoCAD:</label>
                                <input type="file" class="form-control" name="nanocad_file" accept=".db">
                            </div>
                            <button type="submit" class="btn btn-primary">Открыть NanoCAD.db</button>
                        </form>
                    </div>
                    <div class="col-md-6">
                        <form id="rfqForm" enctype="multipart/form-data">
                            <div class="mb-3">
                                <label class="form-label">Файл RFQ:</label>
                                <input type="file" class="form-control" name="rfq_file" accept=".xlsx,.xls">
                            </div>
                            <button type="submit" class="btn btn-primary">Обработать RFQ</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- 04. Проверка Output и КЖ -->
        <div class="card mb-4">
            <div class="card-header bg-light">
                <h5 class="mb-0">Проверить вывод Output (СО) и КЖ</h5>
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-6">
                        <form id="outputForm" enctype="multipart/form-data">
                            <input type="hidden" name="att_type" value="{{ GuiConst.OUTPUT_FILE }}">
                            <div class="mb-3">
                                <label class="form-label">Файл Output:</label>
                                <input type="file" class="form-control" name="gs_files" accept=".xlsx,.xls">
                            </div>
                            <button type="submit" class="btn btn-primary">Проверить Output</button>
                        </form>
                    </div>
                    <div class="col-md-6">
                        <form id="cableForm" enctype="multipart/form-data">
                            <div class="mb-3">
                                <label class="form-label">Папка КЖ:</label>
                                <input type="file" class="form-control" name="cable_folder" multiple webkitdirectory>
                            </div>
                            <button type="submit" class="btn btn-primary">Обработать КЖ</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- 05. Сравнение MTO -->
        <div class="card mb-4">
            <div class="card-header bg-light">
                <h5 class="mb-0">Сравнение МТО</h5>
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-6">
                        <form id="mtoCompareForm" enctype="multipart/form-data">
                            <div class="mb-3">
                                <label class="form-label">MTO файлы (2 шт.):</label>
                                <input type="file" class="form-control" name="mto_folder" multiple accept=".xlsx,.xls">
                            </div>
                            <button type="submit" class="btn btn-primary">MTO vs MTO (2 шт.)</button>
                        </form>
                    </div>
                    <div class="col-md-6">
                        <form id="mtoMultiCompareForm" enctype="multipart/form-data">
                            <div class="mb-3">
                                <label class="form-label">MTO файлы (мульти):</label>
                                <input type="file" class="form-control" name="mto_multi_folder" multiple accept=".xlsx,.xls">
                            </div>
                            <button type="submit" class="btn btn-primary">MTO vs MTO (мульти)</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>
{% endblock %}
